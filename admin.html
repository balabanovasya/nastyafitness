<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="robots" content="noindex, nofollow">
<title>Панель управления сайтом — Анастасия</title>
<style>
  :root{
    --bg:#f6f1ea;--card:#fff;--ink:#2b1d14;--muted:#7b6a5d;--line:#e6dccf;
    --accent:#b8733f;--accent-d:#8f5428;--ok:#2f7d4f;--err:#b3341f;
    --choco:#3F291B;--gold:#e0a862;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header.top{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--choco);color:#fffbf5;
    border-bottom:1px solid rgba(224,168,98,.28);box-shadow:0 6px 22px rgba(30,18,10,.16)
  }
  header.top b{font-size:17px;letter-spacing:.03em;color:#fffbf5}
  header.top .sub{color:#e7c08a;font-size:13px}
  .muted{color:var(--muted)}
  .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dirty{font-size:12.5px;color:#f6d9a8;font-weight:700;background:rgba(224,168,98,.18);padding:5px 11px;border-radius:999px}
  a.link{color:#f6d9a8;text-decoration:none;font-weight:600;font-size:14px}
  a.link:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;transition:.2s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,#edbb75,#c0803a);border:none;color:#2b1a0e;font-weight:700;padding:10px 18px}
  .btn.primary:hover{filter:brightness(1.04)}
  .btn.primary:disabled{opacity:.5;cursor:default}
  .btn.dark{background:var(--choco);border-color:var(--choco);color:#fffbf5;font-weight:600}
  .btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
  .btn.danger{color:var(--err)}
  .layout{display:grid;grid-template-columns:275px 1fr;gap:20px;max-width:1260px;margin:0 auto;padding:20px}
  nav{
    position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:4px;
    max-height:calc(100vh - 96px);overflow-y:auto;padding-bottom:14px
  }
  nav button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;color:var(--ink);font-size:14px}
  nav button:hover{background:rgba(255,255,255,.65)}
  nav button.on{background:#fff;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);font-weight:700;color:var(--choco)}
  nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:12px 12px 4px;font-weight:700}
  main{min-width:0}
  h2{margin:0 0 6px;font-size:22px;color:var(--choco)}
  h3.subhead{margin:20px 0 10px;font-size:16px;color:var(--choco)}
  .lead{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input[type=text],input[type=password],textarea,select{
    width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);font-size:14px
  }
  input[type=color]{width:52px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;flex:none}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  textarea{min-height:86px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:2px solid #f0cfae;border-color:var(--accent)}
  .thumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .thumb img{width:88px;height:88px;object-fit:cover;object-position:top center;border-radius:10px;background:#eadfd0;border:1px solid var(--line);flex:none}
  .thumb.wide img{width:128px;height:96px;object-fit:contain;background:#fffbf5}
  .thumb.tall img{width:84px;height:112px;object-fit:cover;object-position:top center}
  .thumb .meta{font-size:12.5px;color:var(--muted);margin-top:6px;word-break:break-word}
  details.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
  details.grp>summary{cursor:pointer;padding:13px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.grp>summary::after{content:"＋";color:var(--accent);font-weight:700}
  details.grp[open]>summary::after{content:"–"}
  details.grp .body{padding:0 16px 14px}
  .item{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fffdfa}
  .item>summary{cursor:pointer;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .item .tools{display:flex;gap:6px;flex:none}
  .item .inner{padding:2px 14px 14px}
  fieldset{border:1px dashed var(--line);border-radius:12px;margin:12px 0;padding:8px 12px 12px}
  fieldset legend{font-size:13px;font-weight:700;color:var(--choco);padding:0 8px}
  .count{font-size:12px;color:var(--muted);margin-left:6px;font-weight:500}
  .color-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .range-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .range-val{font-weight:700;font-size:13px;color:var(--accent-d);background:#f6efe4;padding:3px 9px;border-radius:8px;white-space:nowrap}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .log{font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#1f1610;color:#f1e6d8;border-radius:12px;padding:12px;max-height:280px;overflow:auto;margin-top:12px}
  .bar{height:8px;background:#eadfd0;border-radius:8px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b1d14;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:92vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #toast.err{background:var(--err)}
  .banner{background:#fff3d6;border:1px solid #eccd82;border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:13.5px}
  .fatal{max-width:640px;margin:48px auto;padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px;line-height:1.6}
  .pill-hint{display:inline-block;background:#f7efe4;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:12px;gap:12px}
    nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;max-height:none;-webkit-overflow-scrolling:touch;gap:6px}
    nav button{white-space:nowrap;background:#fff;border:1px solid var(--line);flex:none}
    nav button.on{background:var(--choco);color:#fffbf5;border-color:var(--choco);box-shadow:none}
    nav .sep{display:none}
    header.top{padding:10px 12px}
    header.top .sub{display:none}
    .btn.primary{padding:8px 14px;font-size:13.5px}
    .grid,.grid-2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="top">
  <div><b id="siteName">Панель управления</b> <span class="sub">· полный контроль каждого пикселя</span></div>
  <div class="top-actions">
    <span id="dirty" class="dirty" hidden>● есть несохранённые правки</span>
    <a class="link" id="openSite" href="index.html" target="_blank" rel="noopener">Открыть сайт ↗</a>
    <button class="btn primary" id="publishTop">Опубликовать изменения</button>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Загружаю актуальную структуру сайта…</p></main>
</div>

<div id="toast"></div>
<iframe id="probe" title="probe" style="display:none"></iframe>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  var clone = function (o) { return o == null ? o : JSON.parse(JSON.stringify(o)); };

  var CFG, IDX, DEF = {}, STOCK = {};
  var ST = { texts: {}, settings: {}, photos: {}, lists: {}, meta: {}, design: {}, reviewsCustom: [] };
  var DEF_REVIEWS = [];
  var staged = {};
  var BASE = '';
  var current = 'photos';
  var base = location.pathname.replace(/[^/]*$/, '');
  var pendingDraft = null;

  function LS(k, v) {
    var key = 'panel2:' + base + ':' + k;
    try {
      if (v === undefined) return localStorage.getItem(key);
      if (v === null) localStorage.removeItem(key);
      else localStorage.setItem(key, v);
    } catch (e) {}
    return null;
  }
  function toast(msg, err) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, err ? 6000 : 2800);
  }

  var LBL = {
    num: 'Номер / метка',
    title: 'Заголовок / Название',
    text: 'Описание / Текст (Enter — новый абзац)',
    name: 'Имя подопечной',
    program: 'Программа / Формат',
    badge: 'Результат (золотая плашка)',
    img: 'Фото (нажмите Заменить фото)',
    imgBefore: 'Фото №1 (До) — отображается без плашек',
    imgAfter: 'Фото №2 (После) — отображается без плашек',
    metrics: 'Показатели (каждый с новой строки)',
    quote: 'Цитата подопечной (новые абзацы сохраняются 1-в-1)',
    q: 'Вопрос',
    a: 'Ответ (Enter — новый абзац)',
    tag: 'Надзаголовок карточки',
    pill: 'Короткая плашка',
    desc: 'Описание тарифа (Enter — новый абзац)',
    price: 'Цена (подтягивается в форму заявки автоматически)',
    period: 'Период (/ в месяц, / разово)',
    featured: 'Выделить карточку тёмным цветом',
    showIncluded: 'Показывать блок «Что входит»',
    label: 'Название вкладки',
    items: 'Карточки тарифов',
    personal: 'А. Личное онлайн-ведение',
    groups: 'Б. Мини-группы',
    plans: 'В. Программы тренировок',
    stretch: 'Г. Растяжка и мобильность'
  };
  var LONG = { text: 1, desc: 1, a: 1, quote: 1 };
  var TITLE_KEYS = ['title', 'name', 'q', 'label', 'tag', 'num'];

  function itemTitle(it, i) {
    if (it && typeof it === 'object') {
      for (var k = 0; k < TITLE_KEYS.length; k++) {
        if (typeof it[TITLE_KEYS[k]] === 'string' && it[TITLE_KEYS[k]]) {
          return (i + 1) + '. ' + it[TITLE_KEYS[k]].slice(0, 62);
        }
      }
    }
    return 'Элемент ' + (i + 1);
  }

  function resolveThumb(path) { return staged[path] ? staged[path].url : path; }
  function thumbError(img, path) {
    var m = String(path || '').match(/^(.*)\.\w+$/);
    if (!img._tried && m && STOCK[m[1]]) { img._tried = 1; img.src = STOCK[m[1]]; }
    else { img.onerror = null; img.style.opacity = .3; }
  }
  function maxPx(hint) {
    if (/avatar|аватар/i.test(hint)) return 900;
    if (/hero|главн|cert|диплом|сертиф/i.test(hint)) return 1800;
    return 1500;
  }
  function processImage(file, limit) {
    return createImageBitmap(file).then(function (bmp) {
      var k = Math.min(1, limit / Math.max(bmp.width, bmp.height));
      var w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, 0, 0, w, h);
      return new Promise(function (res, rej) {
        cv.toBlob(function (b) { b ? res(b) : rej(new Error('toBlob')); }, 'image/jpeg', 0.86);
      });
    });
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 26) || 'photo'; }

  function photoField(getPath, setPath, hint, name, thumbClass) {
    var path = getPath();
    var img = el('img', { alt: '' });
    img.onerror = function () { thumbError(img, path); };
    if (path) img.src = resolveThumb(path);
    else img.style.opacity = .25;

    var meta = el('div', { class: 'meta' }, [path ? ('Файл: ' + (path.indexOf('data:') === 0 ? 'встроенное изображение' : path)) : 'Изображение ещё не загружено']);
    var inp = el('input', { type: 'file', accept: 'image/*', hidden: '' });
    var btn = el('button', { class: 'btn small dark', type: 'button', onclick: function () { inp.click(); } }, ['Заменить фото']);
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      meta.textContent = 'Сжимаю и подготавливаю…';
      processImage(f, maxPx(hint + ' ' + name)).then(function (blob) {
        var p = CFG.photoDir + '/' + slug(name) + '-' + Date.now().toString(36) + '.jpg';
        staged[p] = { blob: blob, url: URL.createObjectURL(blob) };
        setPath(p); path = p; img._tried = 0; img.style.opacity = 1;
        img.onerror = function () { thumbError(img, path); };
        img.src = staged[p].url;
        meta.textContent = 'Готово к публикации (' + Math.round(blob.size / 1024) + ' КБ). Нажмите «Опубликовать».';
        changed();
      }).catch(function () {
        meta.textContent = 'Не удалось обработать файл. Выберите JPG, PNG или WebP.';
        toast('Ошибка обработки фото', true);
      });
      inp.value = '';
    };
    return el('div', { class: 'thumb' + (thumbClass ? ' ' + thumbClass : '') }, [img, el('div', { style: 'flex:1;min-width:160px' }, [btn, inp, meta])]);
  }

  function collect() {
    var ov = { texts: {}, settings: {}, photos: {}, lists: {}, meta: {}, design: {} };
    IDX.fields.forEach(function (f) {
      var v = ST.texts[f.key];
      if (v != null && v.trim() !== '' && v !== f.text) ov.texts[f.key] = v;
    });
    (CFG.settings || []).forEach(function (s) {
      var v = ST.settings[s.key];
      if (v != null && v !== '' && v !== s.def) ov.settings[s.key] = v;
    });
    Object.keys(ST.photos).forEach(function (k) { if (ST.photos[k]) ov.photos[k] = ST.photos[k]; });
    Object.keys(ST.lists).forEach(function (k) {
      if (k === 'reviews') return; // Отзывы ведутся через reviewsCustom
      if (JSON.stringify(ST.lists[k]) !== JSON.stringify(DEF[k])) ov.lists[k] = ST.lists[k];
    });
    if (Array.isArray(ST.reviewsCustom) && ST.reviewsCustom.length) {
      ov.reviewsCustom = ST.reviewsCustom;
    }
    ['title', 'description'].forEach(function (k) {
      var v = ST.meta[k];
      if (v && v !== IDX.meta[k]) ov.meta[k] = v;
    });
    Object.keys(ST.design || {}).forEach(function (k) {
      if (ST.design[k] != null && ST.design[k] !== '') ov.design[k] = ST.design[k];
    });
    return ov;
  }

  function pickPhotos() {
    var o = {};
    Object.keys(ST.photos).forEach(function (k) { if (!staged[ST.photos[k]]) o[k] = ST.photos[k]; });
    return o;
  }

  function changed() {
    var d = JSON.stringify(collect()) !== BASE;
    $('#dirty').hidden = !d;
    try {
      LS('draft', JSON.stringify({
        texts: ST.texts, settings: ST.settings, meta: ST.meta,
        lists: ST.lists, photos: pickPhotos(), design: ST.design,
        reviewsCustom: ST.reviewsCustom
      }));
    } catch (e) {}
  }

  function renderDraftBanner(m) {
    if (!pendingDraft) return;
    var b = el('div', { class: 'banner' }, [
      el('span', null, ['Найден несохранённый локальный черновик с прошлого сеанса.']),
      el('div', { style: 'display:flex;gap:8px;' }, [
        el('button', { class: 'btn small dark', type: 'button', onclick: function () {
          var d = pendingDraft; pendingDraft = null;
          ST.texts = d.texts || ST.texts;
          ST.settings = d.settings || ST.settings;
          ST.meta = d.meta || ST.meta;
          ST.design = d.design || ST.design;
          if (d.lists) ST.lists = Object.assign(ST.lists, d.lists);
          if (d.photos) ST.photos = Object.assign(ST.photos, d.photos);
          if (Array.isArray(d.reviewsCustom) && d.reviewsCustom.length) ST.reviewsCustom = d.reviewsCustom;
          changed();
          show(current);
          toast('Черновик восстановлен');
        } }, ['Восстановить']),
        el('button', { class: 'btn small', type: 'button', onclick: function () {
          pendingDraft = null; LS('draft', null); show(current);
        } }, ['Удалить черновик'])
      ])
    ]);
    m.appendChild(b);
  }

  function show(view) {
    current = view;
    renderNav();
    var m = $('#main');
    m.innerHTML = '';
    renderDraftBanner(m);

    if (view === 'photos') viewPhotos(m);
    else if (view === 'texts') viewTexts(m);
    else if (view === 'design') viewDesign(m);
    else if (view === 'certs') viewCerts(m);
    else if (view === 'reviews') viewReviews(m);
    else if (view === 'settings') viewSettings(m);
    else if (view === 'meta') viewMeta(m);
    else if (view === 'publish') viewPublish(m);
    else if (view.indexOf('list:') === 0) viewList(m, view.slice(5));
    window.scrollTo(0, 0);
  }

  function renderNav() {
    var n = $('#nav'); n.innerHTML = '';
    function add(id, label) {
      n.appendChild(el('button', { class: id === current ? 'on' : '', onclick: function () { show(id); } }, [label]));
    }
    add('photos', '🖼  Фотографии сайта');
    add('texts', '✏️  Все тексты и кнопки');
    add('design', '🎨  Дизайн и каждый пиксель');

    n.appendChild(el('div', { class: 'sep' }, ['Контент и разделы']));
    add('certs', '🎓  Образование (2 документа)');
    add('reviews', '💬  Отзывы (скриншоты переписок)');

    var orderLists = ['goals', 'cases', 'services', 'approach', 'steps', 'faq'];
    orderLists.forEach(function (k) {
      if (CFG.lists && CFG.lists[k] && ST.lists[k] !== undefined) {
        add('list:' + k, CFG.lists[k]);
      }
    });

    n.appendChild(el('div', { class: 'sep' }, ['Настройки и публикация']));
    add('settings', '📞  Контакты и Закон');
    add('meta', '🔗  SEO и предпросмотр ссылок');
    add('publish', '🚀  Публикация в GitHub');
  }

  // --------------------------------------------------------------------------
  // 1. ФОТОГРАФИИ
  // --------------------------------------------------------------------------
  function viewPhotos(m) {
    m.appendChild(el('h2', null, ['Основные фотографии сайта']));
    m.appendChild(el('p', { class: 'lead' }, ['Нажмите «Заменить фото» и выберите снимок. Фотографии кейсов (До/После) меняются в разделе «Результаты и кейсы», скриншоты переписок — в «Отзывы», а диплом и сертификат — в «Образование».']));
    var g = el('div', { class: 'grid' });
    Object.keys(CFG.photoSlots || {}).forEach(function (slot) {
      if (/^cert-[34]$/.test(slot)) return;
      var s = CFG.photoSlots[slot];
      var card = el('div', { class: 'card' }, [
        el('b', null, [s.label]),
        el('div', { class: 'muted', style: 'font-size:12.5px;margin:2px 0 10px' }, [s.hint || ''])
      ]);
      card.appendChild(photoField(
        function () { return ST.photos[slot] || IDX.photoSrc[slot] || (CFG.photoDir + '/' + slot + '.jpg'); },
        function (p) { ST.photos[slot] = p; },
        s.label + ' ' + (s.hint || ''), slot,
        /^cert-/.test(slot) ? 'wide' : ''
      ));
      g.appendChild(card);
    });
    m.appendChild(g);
  }

  // --------------------------------------------------------------------------

  function viewTexts(m) {
    m.appendChild(el('h2', null, ['Все тексты, заголовки и кнопки сайта']));
    m.appendChild(el('p', { class: 'lead' }, ['Слово, которое нужно выделить золотым курсивом, берите в звёздочки: *система*. Переносы строк (клавиша Enter) сохраняются на сайте 1-в-1. Очистка поля возвращает исходный текст.']));
    var q = el('input', { type: 'text', placeholder: '🔍 Быстрый поиск любого слова или фразы на сайте…' });
    m.appendChild(q);
    var wrap = el('div', { style: 'margin-top:12px' }); m.appendChild(wrap);

    var order = [];
    (CFG.groups || []).forEach(function (g) { if (order.indexOf(g[1]) < 0) order.push(g[1]); });
    order.push('Прочее');

    function draw() {
      wrap.innerHTML = '';
      var term = q.value.trim().toLowerCase();
      order.forEach(function (gname) {
        var list = IDX.fields.filter(function (f) {
          if (f.group !== gname) return false;
          if (!term) return true;
          var v = (ST.texts[f.key] != null ? ST.texts[f.key] : f.text).toLowerCase();
          return v.indexOf(term) >= 0 || f.text.toLowerCase().indexOf(term) >= 0;
        });
        if (!list.length) return;
        var d = el('details', { class: 'grp', open: '' });
        d.appendChild(el('summary', null, [gname + ' ', el('span', { class: 'count' }, [String(list.length)])]));
        var body = el('div', { class: 'body' });
        list.forEach(function (f) {
          var val = ST.texts[f.key] != null ? ST.texts[f.key] : f.text;
          var useArea = f.multi || val.indexOf('\n') >= 0 || val.length > 52;
          var inp = useArea ? el('textarea') : el('input', { type: 'text' });
          inp.value = val;
          inp.oninput = function () {
            if (inp.value === f.text || inp.value === '') delete ST.texts[f.key];
            else ST.texts[f.key] = inp.value;
            changed();
          };
          var lab = el('label', { class: 'f' }, [
            f.count > 1
              ? 'Встречается ' + f.count + ' раз(а) — обновится везде'
              : 'Исходный: «' + f.text.replace(/\n/g, ' ↵ ').slice(0, 58) + (f.text.length > 58 ? '…' : '') + '»'
          ]);
          body.appendChild(lab);
          body.appendChild(inp);
        });
        d.appendChild(body);
        wrap.appendChild(d);
      });
      if (!wrap.firstChild) wrap.appendChild(el('p', { class: 'muted' }, ['По вашему запросу ничего не найдено.']));
    }
    q.oninput = draw;
    draw();
  }

  function renderValue(parent, k, name, redraw) {
    var v = parent[k], lab = LBL[k] || (typeof k === 'string' ? k : '');
    if (Array.isArray(v)) {
      if (!v.length || typeof v[0] === 'string') {
        var ta = el('textarea'); ta.value = v.join('\n');
        ta.oninput = function () {
          parent[k] = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
          changed();
        };
        return el('div', null, [el('label', { class: 'f' }, [lab]), ta]);
      }
      var box = el('div');
      v.forEach(function (it, i) {
        var d = el('details', { class: 'item', open: i === 0 ? '' : null });
        var tools = el('span', { class: 'tools' }, [
          el('button', { class: 'btn small', type: 'button', title: 'Выше', onclick: function (e) { e.preventDefault(); if (i > 0) { v.splice(i - 1, 0, v.splice(i, 1)[0]); changed(); redraw(); } } }, ['↑']),
          el('button', { class: 'btn small', type: 'button', title: 'Ниже', onclick: function (e) { e.preventDefault(); if (i < v.length - 1) { v.splice(i + 1, 0, v.splice(i, 1)[0]); changed(); redraw(); } } }, ['↓']),
          el('button', { class: 'btn small', type: 'button', title: 'Дублировать', onclick: function (e) { e.preventDefault(); v.splice(i + 1, 0, clone(it)); changed(); redraw(); } }, ['⧉']),
          el('button', { class: 'btn small danger', type: 'button', title: 'Удалить', onclick: function (e) { e.preventDefault(); if (confirm('Удалить «' + itemTitle(it, i) + '»?')) { v.splice(i, 1); changed(); redraw(); } } }, ['🗑'])
        ]);
        d.appendChild(el('summary', null, [el('span', null, [itemTitle(it, i)]), tools]));
        var inner = el('div', { class: 'inner' });
        if (it && typeof it === 'object') {
          Object.keys(it).forEach(function (kk) {
            inner.appendChild(renderValue(it, kk, name + '-' + (i + 1) + '-' + kk, redraw));
          });
        }
        d.appendChild(inner);
        box.appendChild(d);
      });
      return box;
    }
    if (v && typeof v === 'object') {
      var fs = el('fieldset', null, [el('legend', null, [LBL[k] || (parent[k].label ? parent[k].label : k)])]);
      var objKeys = Object.keys(v);
      if (k === 'services') {
        var pref = ['personal', 'groups', 'plans', 'stretch'];
        objKeys = pref.filter(function (x) { return objKeys.indexOf(x) >= 0; }).concat(objKeys.filter(function (x) { return pref.indexOf(x) < 0; }));
      }
      objKeys.forEach(function (kk) { fs.appendChild(renderValue(v, kk, name + '-' + kk, redraw)); });
      return fs;
    }
    if (typeof v === 'boolean') {
      var cb = el('input', { type: 'checkbox' }); cb.checked = v;
      cb.onchange = function () { parent[k] = cb.checked; changed(); };
      return el('label', { class: 'f' }, [cb, ' ' + lab]);
    }
    if (typeof k === 'string' && /^img/i.test(k)) {
      return el('div', null, [
        el('label', { class: 'f' }, [lab]),
        photoField(function () { return parent[k]; }, function (p) { parent[k] = p; }, name, slug(name))
      ]);
    }
    var long = (typeof v === 'string' && (v.length > 62 || LONG[k] || v.indexOf('\n') >= 0));
    var inp = long ? el('textarea') : el('input', { type: 'text' });
    inp.value = v == null ? '' : v;
    inp.oninput = function () { parent[k] = typeof v === 'number' ? Number(inp.value) : inp.value; changed(); };
    return el('div', null, [el('label', { class: 'f' }, [lab]), inp]);
  }

  // --------------------------------------------------------------------------
  // 9. ПУБЛИКАЦИЯ В GITHUB + РЕЗЕРВНОЕ СКАЧИВАНИЕ CONTENT.JS
  // --------------------------------------------------------------------------
  function guessRepo() {
    var h = location.hostname;
    if (/anastasia-fitness\.ru$/i.test(h)) {
      return 'balabanovasya/nastyafitness';
    }
    return 'balabanovasya/nastyafitness';
  }

  function buildContentJs(ov) {
    return '/* Этот файл создаёт панель управления (admin.html). Вручную не редактируйте. */\nwindow.SITE_OVERRIDES = ' + JSON.stringify(ov, null, 2) + ';\n';
  }

  function viewPublish(m) {
    m.appendChild(el('h2', null, ['Публикация изменений на сайт (GitHub)']));
    m.appendChild(el('p', { class: 'lead' }, ['Нажмите «Опубликовать изменения» — панель загрузит все новые фотографии и скриншоты в папку photos/ и обновит content.js без потери ранее загруженных фото.']));

    var c = el('div', { class: 'card' });
    var repo = el('input', { type: 'text', placeholder: 'balabanovasya/nastyafitness' });
    var savedRepo = LS('repo'); if (savedRepo === 'anastasia-fitness/nastyafitness') { savedRepo = ''; LS('repo', null); }
    repo.value = savedRepo || guessRepo();
    var tok = el('input', { type: 'password', placeholder: 'github_pat_… или ghp_…' });
    tok.value = LS('token') || '';
    var rem = el('input', { type: 'checkbox' }); rem.checked = !!LS('token');

    c.appendChild(el('label', { class: 'f' }, ['Репозиторий сайта (владелец/название)'])); c.appendChild(repo);
    c.appendChild(el('label', { class: 'f' }, ['Ключ доступа GitHub (Personal Access Token)'])); c.appendChild(tok);
    c.appendChild(el('label', { class: 'f' }, [rem, ' Запомнить ключ на этом устройстве']));

    var btns = el('div', { class: 'row-actions', style: 'margin-top:16px;margin-bottom:0;' });
    var go = el('button', { class: 'btn primary', type: 'button' }, ['☁ Опубликовать изменения']);
    var dl = el('button', { class: 'btn', type: 'button', onclick: function () {
      var text = buildContentJs(collect());
      var blob = new Blob([text], { type: 'application/javascript;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'content.js'; a.click();
      URL.revokeObjectURL(url);
      toast('Файл content.js скачан');
    } }, ['⬇ Скачать content.js']);
    btns.appendChild(go); btns.appendChild(dl);
    c.appendChild(btns);

    var bar = el('div', { class: 'bar' }, [el('i')]);
    var log = el('div', { class: 'log', hidden: '' });
    c.appendChild(bar); c.appendChild(log);
    m.appendChild(c);

    function say(t) { log.hidden = false; log.textContent += t + '\n'; log.scrollTop = log.scrollHeight; }
    go.onclick = function () { runPublish(repo.value.trim(), tok.value.trim(), rem.checked, say, bar.firstChild, go); };
    window.__publishUI = { repo: repo, tok: tok, rem: rem, say: say, bar: bar.firstChild, go: go };
  }

  function b64FromBlob(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }
  function b64FromText(t) { return btoa(unescape(encodeURIComponent(t))); }
  function gh(token, path, opt) {
    opt = opt || {};
    return fetch('https://api.github.com' + path, {
      method: opt.method || 'GET',
      cache: 'no-store',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: opt.body ? JSON.stringify(opt.body) : undefined
    });
  }
  function explain(status) {
    return status === 401 ? 'GitHub не принял ключ (неверный или истёк).' :
           status === 403 ? 'У ключа нет прав Contents -> Read and write.' :
           status === 404 ? 'Репозиторий не найден или нет доступа.' :
           'Ошибка GitHub (' + status + ').';
  }

  var publishing = false;
  function runPublish(repo, token, remember, say, bar, btn) {
    if (publishing) return;
    if (!/^[\w.\-]+\/[\w.\-]+$/.test(repo)) { toast('Укажите репозиторий в формате ник/название', true); return show('publish'); }
    if (!token) { toast('Вставьте ключ GitHub', true); return show('publish'); }

    var ov = collect(), json = JSON.stringify(ov);
    var used = Object.keys(staged).filter(function (p) { return json.indexOf(p) >= 0; });
    publishing = true; if (btn) btn.disabled = true; $('#publishTop').disabled = true;
    LS('repo', repo); LS('token', remember ? token : null);
    var branch = '', total = used.length + 1, done = 0;
    function tick() { done++; if (bar) bar.style.width = Math.round(done / total * 100) + '%'; }
    say('Проверяю доступ к ' + repo + '…');

    gh(token, '/repos/' + repo).then(function (r) {
      if (!r.ok) throw new Error(explain(r.status));
      return r.json();
    }).then(function (info) {
      branch = info.default_branch || 'main';
      say('Ветка: ' + branch + '. Новых фото/скриншотов к загрузке: ' + used.length);
      var chain = Promise.resolve();
      used.forEach(function (p) {
        chain = chain.then(function () {
          return gh(token, '/repos/' + repo + '/contents/' + p + '?ref=' + encodeURIComponent(branch)).then(function (rCheck) {
            return rCheck.ok ? rCheck.json() : null;
          }).then(function (existingFile) {
            return b64FromBlob(staged[p].blob).then(function (b64) {
              var putBody = { message: 'Панель: фото ' + p, content: b64, branch: branch };
              if (existingFile && existingFile.sha) putBody.sha = existingFile.sha;
              return gh(token, '/repos/' + repo + '/contents/' + p, { method: 'PUT', body: putBody });
            });
          }).then(function (r) {
            if (!r.ok) throw new Error(explain(r.status) + ' (' + p + ')');
            delete staged[p];
            say('✓ Фото сохранено: ' + p);
            tick();
          });
        });
      });
      return chain;
    }).then(function () {
      return gh(token, '/repos/' + repo + '/contents/content.js?ref=' + encodeURIComponent(branch) + '&_t=' + Date.now());
    }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(explain(r.status));
      return r.json();
    }).then(function (cur) {
      if (cur && cur.content) {
        try {
          var decoded = decodeURIComponent(escape(atob(cur.content.replace(/\s/g, ''))));
          var m = decoded.match(/window\.SITE_OVERRIDES\s*=\s*(\{[\s\S]*\})\s*;?/);
          if (m) {
            var remoteOv = JSON.parse(m[1]);
            ov.photos = Object.assign({}, remoteOv.photos || {}, ov.photos || {});
          }
        } catch (e) {}
      }
      var text = buildContentJs(ov);
      var body = { message: 'Панель: обновление контента и дизайна', content: b64FromText(text), branch: branch };
      if (cur && cur.sha) body.sha = cur.sha;
      return gh(token, '/repos/' + repo + '/contents/content.js', { method: 'PUT', body: body });
    }).then(function (r) {
      if (!r.ok) throw new Error(explain(r.status));
      tick();
      ST.photos = ov.photos || {};
      BASE = JSON.stringify(collect());
      LS('draft', null);
      pendingDraft = null;
      changed();
      say('✓ content.js обновлён!\n\nГотово! Через 1–2 минуты обновите сайт на телефоне и компьютере.');
      toast('Опубликовано ✓');
    }).catch(function (e) {
      say('✗ ' + (e && e.message ? e.message : e));
      toast(String(e && e.message || e), true);
    }).then(function () {
      publishing = false; if (btn) btn.disabled = false; $('#publishTop').disabled = false;
    });

    if (current !== 'publish') {
      show('publish');
      setTimeout(function () { var u = window.__publishUI; if (u) u.say('Публикую…'); }, 0);
    }
  }

  $('#publishTop').onclick = function () {
    var repo = LS('repo') || guessRepo(), token = LS('token');
    if (!repo || !token) { show('publish'); toast('Сначала вставьте ключ GitHub', true); return; }
    show('publish');
    var u = window.__publishUI;
    runPublish(repo, token, true, u.say, u.bar, u.go);
  };

  function fatal(html) { $('#main').innerHTML = ''; $('#main').appendChild(el('div', { class: 'fatal', html: html })); }

  function ready(w) {
    CFG = w.SITE_EDIT;
    IDX = w.SITE_EDIT_INDEX;
    STOCK = w.STOCK || {};
    DEF = clone(w.SITE_DEFAULTS || {});
    var OV = clone(w.SITE_OVERRIDES || {});

    ST.texts = OV.texts || {};
    ST.settings = OV.settings || {};
    ST.photos = OV.photos || {};
    ST.meta = OV.meta || {};
    ST.design = OV.design || {};
    ST.lists = clone(w.SITE_DATA_REF || {});

    // Гарантируем порядок сервисов А -> Б (Мини-группы) -> В (Программы) -> Г (Растяжка)
    if (ST.lists.services) {
      var ordSrv = {};
      ['personal', 'groups', 'plans', 'stretch'].forEach(function (k) {
        if (ST.lists.services[k]) ordSrv[k] = ST.lists.services[k];
      });
      Object.keys(ST.lists.services).forEach(function (k) {
        if (!ordSrv[k]) ordSrv[k] = ST.lists.services[k];
      });
      ST.lists.services = ordSrv;
    }

    // Инициализируем отзывы со скриншотами
    if (Array.isArray(OV.reviewsCustom) && OV.reviewsCustom.length) {
      ST.reviewsCustom = OV.reviewsCustom;
    } else if (Array.isArray(ST.lists.reviews) && ST.lists.reviews.length) {
      ST.reviewsCustom = ST.lists.reviews.map(function (r, idx) {
        var slot = 'rev-screen-' + (idx + 1);
        return {
          name: r.name || '',
          program: r.program || '',
          badge: r.badge || '',
          screenshot: (ST.photos && ST.photos[slot]) || ''
        };
      });
    } else {
      ST.reviewsCustom = [
        { name: 'Анна, 26 лет', program: 'Растяжка • 12 занятий', badge: 'Гибкость и 0 боли', screenshot: '' },
        { name: 'Мария, 31 год', program: 'Личное ведение • 2 месяца', badge: '-6 кг без диет', screenshot: '' }
      ];
    }
    DEF_REVIEWS = clone(ST.reviewsCustom);

    BASE = JSON.stringify(collect());

    try {
      var saved = LS('draft');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') pendingDraft = parsed;
      }
    } catch (e) {}

    $('#siteName').textContent = CFG.name || 'Панель управления';
    document.title = 'Панель — ' + (CFG.name || 'сайт');
    show('photos');
  }

  var f = $('#probe');
  var panelOpened = false;
  var tries = 0;

  function tryOpenPanel() {
    if (panelOpened) return true;
    try {
      var w = f.contentWindow;
      if (w && w.SITE_EDIT_INDEX && w.SITE_EDIT && w.SITE_EDIT.lists && w.SITE_EDIT.lists.certs) {
        panelOpened = true;
        try { if (w.stop) w.stop(); } catch (e) {}
        ready(w);
        return true;
      }
    } catch (e) {
      panelOpened = true;
      fatal('<b>Откройте панель по адресу вашего сайта</b> (<code>https://anastasia-fitness.ru/admin.html</code>), а не как локальный файл с компьютера.');
      return true;
    }
    return false;
  }

  f.onload = function () { tryOpenPanel(); };
  f.src = 'index.html?panel=' + Date.now();

  (function pollProbe() {
    if (tryOpenPanel()) return;
    if (++tries > 120) {
      try {
        var w2 = f.contentWindow;
        if (w2 && w2.SITE_EDIT_INDEX && w2.SITE_EDIT) {
          panelOpened = true;
          try { if (w2.stop) w2.stop(); } catch (e) {}
          return ready(w2);
        }
      } catch (e) {}
      return fatal('Сайт не успел инициализироваться. Проверьте, что рядом лежат <code>index.html</code> и <code>patches.js</code>, и нажмите Обновить (Cmd+R).');
    }
    setTimeout(pollProbe, 120);
  })();
})();
</script>
