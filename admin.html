<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Панель управления сайтом</title>
<style>
  :root{--bg:#f6f1ea;--card:#fff;--ink:#2b1d14;--muted:#7b6a5d;--line:#e6dccf;--accent:#b8733f;--accent-d:#8f5428;--ok:#2f7d4f;--err:#b3341f}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
  header.top b{font-size:17px}
  .muted{color:var(--muted)}
  .top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dirty{font-size:13px;color:var(--accent-d);font-weight:600}
  a.link{color:var(--accent-d);text-decoration:none;font-weight:600}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:10px 18px}
  .btn.primary:hover{background:var(--accent-d)}
  .btn.primary:disabled{opacity:.5;cursor:default}
  .btn.small{padding:4px 10px;font-size:13px;border-radius:8px}
  .btn.danger{color:var(--err)}
  .layout{display:grid;grid-template-columns:260px 1fr;gap:20px;max-width:1220px;margin:0 auto;padding:20px}
  nav{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 96px);overflow-y:auto}
  nav button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;color:var(--ink)}
  nav button.on{background:#fff;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);font-weight:700}
  nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:12px 12px 4px}
  main{min-width:0}
  h2{margin:0 0 6px;font-size:22px}
  .lead{margin:0 0 18px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=password],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input[type=color]{width:56px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  textarea{min-height:80px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid #f0cfae;border-color:var(--accent)}
  .thumb{display:flex;align-items:center;gap:12px}
  .thumb img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:#eadfd0;border:1px solid var(--line);flex:none}
  .thumb .meta{font-size:13px;color:var(--muted)}
  details.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
  details.grp>summary{cursor:pointer;padding:13px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
  details.grp>summary::after{content:"＋";color:var(--accent)}
  details.grp[open]>summary::after{content:"–"}
  details.grp .body{padding:0 16px 14px}
  .item{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fffdfa}
  .item>summary{cursor:pointer;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .item .tools{display:flex;gap:6px;flex:none}
  .item .inner{padding:2px 14px 14px}
  fieldset{border:1px dashed var(--line);border-radius:12px;margin:10px 0;padding:6px 12px 12px}
  fieldset legend{font-size:13px;color:var(--muted);padding:0 6px}
  .count{font-size:12px;color:var(--muted);margin-left:6px}
  .color-row{display:flex;align-items:center;gap:10px;margin-top:6px}
  .log{font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#1f1610;color:#f1e6d8;border-radius:12px;padding:12px;max-height:260px;overflow:auto;margin-top:12px}
  .bar{height:8px;background:#eadfd0;border-radius:8px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b1d14;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #toast.err{background:var(--err)}
  .banner{background:#fff3d6;border:1px solid #f0d9a0;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  .fatal{max-width:640px;margin:60px auto;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;padding:12px}
    nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;max-height:none}
    nav button{white-space:nowrap;background:#fff;border:1px solid var(--line)}
    nav .sep{display:none}
    header.top{padding:10px 12px}
  }
</style>
</head>
<body>
<header class="top">
  <div><b id="siteName">Панель управления</b> <span class="muted">· полный контроль сайта</span></div>
  <div class="top-actions">
    <span id="dirty" class="dirty" hidden>● есть неопубликованные изменения</span>
    <a class="link" id="openSite" href="index.html" target="_blank" rel="noopener">Открыть сайт ↗</a>
    <button class="btn primary" id="publishTop">Опубликовать изменения</button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Загружаю структуру сайта…</p></main>
</div>
<div id="toast"></div>
<iframe id="probe" title="probe" style="display:none"></iframe>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  var clone = function (o) { return o == null ? o : JSON.parse(JSON.stringify(o)); };
  var CFG, IDX, DEF = {}, STOCK = {};
  var ST = { texts: {}, settings: {}, photos: {}, lists: {}, meta: {}, design: {} };
  var staged = {};
  var BASE = '';
  var current = 'photos';
  var base = location.pathname.replace(/[^/]*$/, '');

  function LS(k, v) {
    var key = 'panel:' + base + ':' + k;
    try {
      if (v === undefined) return localStorage.getItem(key);
      if (v === null) localStorage.removeItem(key);
      else localStorage.setItem(key, v);
    } catch (e) {}
    return null;
  }
  function toast(msg, err) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, err ? 6000 : 2800);
  }

  var LBL = {
    num: 'Номер / метка', title: 'Заголовок / Название', text: 'Описание / Текст',
    name: 'Имя подопечной', program: 'Программа / Формат', badge: 'Результат (плашка)',
    img: 'Фото / Скан (нажмите Заменить фото)', imgBefore: 'Фото «Точка А (До)»', imgAfter: 'Фото «Результат (После)»',
    metrics: 'Показатели (каждый с новой строки)', quote: 'Цитата подопечной',
    q: 'Вопрос', a: 'Ответ', tag: 'Метка над названием', pill: 'Короткая плашка',
    desc: 'Описание тарифа', price: 'Цена', period: 'Период (/ в месяц, / разово)',
    featured: 'Выделить карточку темным цветом', showIncluded: 'Показывать блок «Что входит»',
    label: 'Название вкладки', items: 'Карточки тарифов',
    groups: 'В. Мини-группы', personal: 'А. Личное ведение', plans: 'Б. Программы', stretch: 'Г. Растяжка'
  };
  var LONG = { text: 1, desc: 1, a: 1, quote: 1 };
  var TITLE_KEYS = ['title', 'name', 'q', 'label', 'tag', 'num'];

  function itemTitle(it, i) {
    if (it && typeof it === 'object') {
      for (var k = 0; k < TITLE_KEYS.length; k++) {
        if (typeof it[TITLE_KEYS[k]] === 'string' && it[TITLE_KEYS[k]]) return (i + 1) + '. ' + it[TITLE_KEYS[k]].slice(0, 60);
      }
    }
    return 'Элемент ' + (i + 1);
  }

  function resolveThumb(path) { return staged[path] ? staged[path].url : path; }
  function thumbError(img, path) {
    var m = String(path).match(/^(.*)\.\w+$/);
    if (!img._tried && m && STOCK[m[1]]) { img._tried = 1; img.src = STOCK[m[1]]; }
    else { img.onerror = null; img.style.opacity = .35; }
  }
  function maxPx(hint) { return /avatar|аватар/i.test(hint) ? 900 : /hero|главн|cert|сертиф/i.test(hint) ? 1800 : 1500; }
  function processImage(file, limit) {
    return createImageBitmap(file).then(function (bmp) {
      var k = Math.min(1, limit / Math.max(bmp.width, bmp.height));
      var w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, 0, 0, w, h);
      return new Promise(function (res, rej) { cv.toBlob(function (b) { b ? res(b) : rej(new Error('toBlob')); }, 'image/jpeg', 0.85); });
    });
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'photo'; }

  function photoField(getPath, setPath, hint, name) {
    var path = getPath();
    var img = el('img', { alt: '' });
    img.onerror = function () { thumbError(img, path); };
    img.src = resolveThumb(path);
    var meta = el('div', { class: 'meta' }, ['Текущий файл: ' + (path || 'авто')]);
    var inp = el('input', { type: 'file', accept: 'image/*', hidden: '' });
    var btn = el('button', { class: 'btn small', type: 'button', onclick: function () { inp.click(); } }, ['Заменить фото']);
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      meta.textContent = 'Обрабатываю…';
      processImage(f, maxPx(hint + ' ' + name)).then(function (blob) {
        var p = CFG.photoDir + '/' + slug(name) + '-' + Date.now().toString(36) + '.jpg';
        staged[p] = { blob: blob, url: URL.createObjectURL(blob) };
        setPath(p); path = p; img._tried = 0;
        img.onerror = function () { thumbError(img, path); };
        img.src = staged[p].url;
        meta.textContent = 'Готово к загрузке (' + Math.round(blob.size / 1024) + ' КБ). Нажмите «Опубликовать».';
        changed();
      }).catch(function () {
        meta.textContent = 'Не удалось обработать файл. Выберите JPG или PNG.';
        toast('Ошибка обработки фото', true);
      });
      inp.value = '';
    };
    return el('div', { class: 'thumb' }, [img, el('div', null, [btn, inp, meta])]);
  }

  function collect() {
    var ov = { texts: {}, settings: {}, photos: {}, lists: {}, meta: {}, design: {} };
    IDX.fields.forEach(function (f) {
      var v = ST.texts[f.key];
      if (v != null && v.trim() !== '' && v !== f.text) ov.texts[f.key] = v;
    });
    (CFG.settings || []).forEach(function (s) {
      var v = ST.settings[s.key];
      if (v != null && v !== '' && v !== s.def) ov.settings[s.key] = v;
    });
    Object.keys(ST.photos).forEach(function (k) { if (ST.photos[k]) ov.photos[k] = ST.photos[k]; });
    Object.keys(ST.lists).forEach(function (k) {
      if (JSON.stringify(ST.lists[k]) !== JSON.stringify(DEF[k])) ov.lists[k] = ST.lists[k];
    });
    ['title', 'description'].forEach(function (k) {
      var v = ST.meta[k];
      if (v && v !== IDX.meta[k]) ov.meta[k] = v;
    });
    Object.keys(ST.design || {}).forEach(function (k) {
      if (ST.design[k]) ov.design[k] = ST.design[k];
    });
    return ov;
  }

  function pickPhotos() {
    var o = {};
    Object.keys(ST.photos).forEach(function (k) { if (!staged[ST.photos[k]]) o[k] = ST.photos[k]; });
    return o;
  }

  function changed() {
    var d = JSON.stringify(collect()) !== BASE;
    $('#dirty').hidden = !d;
    try {
      LS('draft', JSON.stringify({
        texts: ST.texts, settings: ST.settings, meta: ST.meta,
        lists: ST.lists, photos: pickPhotos(), design: ST.design
      }));
    } catch (e) {}
  }

  function show(view) {
    current = view; renderNav();
    var m = $('#main'); m.innerHTML = '';
    if (view === 'photos') viewPhotos(m);
    else if (view === 'texts') viewTexts(m);
    else if (view === 'design') viewDesign(m);
    else if (view === 'settings') viewSettings(m);
    else if (view === 'meta') viewMeta(m);
    else if (view === 'publish') viewPublish(m);
    else if (view.indexOf('list:') === 0) viewList(m, view.slice(5));
    window.scrollTo(0, 0);
  }

  function renderNav() {
    var n = $('#nav'); n.innerHTML = '';
    function add(id, label) {
      n.appendChild(el('button', { class: id === current ? 'on' : '', onclick: function () { show(id); } }, [label]));
    }
    add('photos', '🖼  Все фотографии и сканы');
    add('texts', '✏️  Все тексты и кнопки');
    add('design', '🎨  Дизайн и визуал');
    var keys = Object.keys(CFG.lists || {});
    if (keys.length) {
      n.appendChild(el('div', { class: 'sep' }, ['Блоки и карточки']));
      keys.forEach(function (k) { if (ST.lists[k] !== undefined) add('list:' + k, CFG.lists[k]); });
    }
    n.appendChild(el('div', { class: 'sep' }, ['Настройки и закон']));
    add('settings', '📞  Контакты, Яндекс Форма, Закон');
    add('meta', '🔗  Заголовок для соцсетей (SEO)');
    add('publish', '🚀  Публикация в GitHub');
  }

  function viewPhotos(m) {
    m.appendChild(el('h2', null, ['Фотографии и сканы на сайте']));
    m.appendChild(el('p', { class: 'lead' }, ['Нажмите «Заменить фото» и выберите файл. Фотографии в кейсах, отзывах и подходе также можно менять внутри соответствующих разделов слева.']));
    var g = el('div', { class: 'grid' });
    Object.keys(CFG.photoSlots || {}).forEach(function (slot) {
      var s = CFG.photoSlots[slot];
      var card = el('div', { class: 'card' }, [
        el('b', null, [s.label]),
        el('div', { class: 'muted', style: 'font-size:13px;margin:2px 0 10px' }, [s.hint || ''])
      ]);
      card.appendChild(photoField(
        function () { return ST.photos[slot] || IDX.photoSrc[slot] || (CFG.photoDir + '/' + slot + '.jpg'); },
        function (p) { ST.photos[slot] = p; },
        s.label + ' ' + (s.hint || ''), slot
      ));
      g.appendChild(card);
    });
    m.appendChild(g);
  }

  function viewTexts(m) {
    m.appendChild(el('h2', null, ['Все тексты, заголовки и кнопки сайта']));
    m.appendChild(el('p', { class: 'lead' }, ['Здесь собраны все текстовые элементы страницы. Слово, которое нужно выделить золотым курсивом, берите в звёздочки: *система*. Если очистить поле — вернётся исходный текст.']));
    var q = el('input', { type: 'text', placeholder: '🔍 Быстрый поиск любого слова или фразы на сайте…' });
    m.appendChild(q);
    var wrap = el('div', { style: 'margin-top:12px' }); m.appendChild(wrap);
    var order = [];
    (CFG.groups || []).forEach(function (g) { if (order.indexOf(g[1]) < 0) order.push(g[1]); });
    order.push('Прочее');

    function draw() {
      wrap.innerHTML = '';
      var term = q.value.trim().toLowerCase();
      order.forEach(function (gname) {
        var list = IDX.fields.filter(function (f) {
          if (f.group !== gname) return false;
          if (!term) return true;
          var v = (ST.texts[f.key] != null ? ST.texts[f.key] : f.text).toLowerCase();
          return v.indexOf(term) >= 0 || f.text.toLowerCase().indexOf(term) >= 0;
        });
        if (!list.length) return;
        var d = el('details', { class: 'grp', open: '' });
        d.appendChild(el('summary', null, [gname + ' ', el('span', { class: 'count' }, [String(list.length)])]));
        var body = el('div', { class: 'body' });
        list.forEach(function (f) {
          var val = ST.texts[f.key] != null ? ST.texts[f.key] : f.text;
          var inp = f.multi ? el('textarea') : el('input', { type: 'text' });
          inp.value = val;
          inp.oninput = function () {
            if (inp.value === f.text || inp.value === '') delete ST.texts[f.key];
            else ST.texts[f.key] = inp.value;
            changed();
          };
          var lab = el('label', { class: 'f' }, [f.count > 1 ? 'Встречается ' + f.count + ' раз(а) — обновится везде' : 'Исходный: «' + f.text.slice(0, 55) + (f.text.length > 55 ? '…' : '') + '»']);
          body.appendChild(lab);
          body.appendChild(inp);
        });
        d.appendChild(body); wrap.appendChild(d);
      });
      if (!wrap.firstChild) wrap.appendChild(el('p', { class: 'muted' }, ['По вашему запросу ничего не найдено.']));
    }
    q.oninput = draw; draw();
  }

  function viewDesign(m) {
    m.appendChild(el('h2', null, ['Дизайн, палитра и визуальные эффекты']));
    m.appendChild(el('p', { class: 'lead' }, ['Тонкая настройка цветовой гаммы сайта, плавного растворения фотографий Насти в фон и прозрачности 15 гипсовых барельефов.']));

    var palette = [
      ['--bg-soft', 'Основной мягкий фон сайта', '#FFFBF5'],
      ['--bg-milk', 'Молочный фон карточек и секций', '#F7EFE4'],
      ['--bg-taupe', 'Бежево-тауповый фон (Услуги)', '#E9DCC9'],
      ['--deep-choco', 'Глубокий шоколадный (заголовки и темные блоки)', '#3F291B'],
      ['--accent-brown', 'Акцентный кофейно-коричневый', '#8A6446'],
      ['--gold', 'Золотой акцент (кнопки, курсив, иконки)', '#C9904E']
    ];
    var g = el('div', { class: 'grid' });
    palette.forEach(function (item) {
      var cssVar = item[0], title = item[1], defHex = item[2];
      var curVal = (ST.design && ST.design[cssVar]) || defHex;
      var colInp = el('input', { type: 'color', value: curVal });
      var txtInp = el('input', { type: 'text', value: curVal });
      colInp.oninput = function () { txtInp.value = colInp.value; ST.design[cssVar] = colInp.value; changed(); };
      txtInp.oninput = function () {
        if (!txtInp.value || txtInp.value === defHex) delete ST.design[cssVar];
        else { ST.design[cssVar] = txtInp.value; colInp.value = txtInp.value; }
        changed();
      };
      var rst = el('button', { class: 'btn small', type: 'button', onclick: function () {
        delete ST.design[cssVar]; colInp.value = defHex; txtInp.value = defHex; changed();
      } }, ['Сброс']);
      var c = el('div', { class: 'card' }, [
        el('b', null, [title]),
        el('div', { class: 'color-row' }, [colInp, txtInp, rst])
      ]);
      g.appendChild(c);
    });
    m.appendChild(g);
  }

  function viewSettings(m) {
    m.appendChild(el('h2', null, ['Контакты, Яндекс Форма и Юридические данные']));
    m.appendChild(el('p', { class: 'lead' }, ['Телефон, ссылки на соцсети, подключение Яндекс Формы (с сохранением нашего стиля), реквизиты самозанятой и настройки эффектов.']));
    (CFG.settings || []).forEach(function (s) {
      var c = el('div', { class: 'card' }, [el('b', null, [s.label])]);
      if (s.hint) c.appendChild(el('div', { class: 'muted', style: 'font-size:13px; margin-top:2px;' }, [s.hint]));
      var inp = el('input', { type: 'text' });
      inp.value = ST.settings[s.key] != null ? ST.settings[s.key] : s.def;
      inp.style.marginTop = '8px';
      inp.oninput = function () {
        if (inp.value === s.def || inp.value === '') delete ST.settings[s.key];
        else ST.settings[s.key] = inp.value.trim();
        changed();
      };
      c.appendChild(inp); m.appendChild(c);
    });
  }

  function viewMeta(m) {
    m.appendChild(el('h2', null, ['Название и описание для ссылок (SEO / Мессенджеры)']));
    m.appendChild(el('p', { class: 'lead' }, ['То, что отображается во вкладке браузера и в карточке предпросмотра при отправке ссылки в Telegram, WhatsApp или Instagram.']));
    [['title', 'Заголовок страницы (Title)'], ['description', 'Краткое описание (Description)']].forEach(function (p) {
      var c = el('div', { class: 'card' }, [el('b', null, [p[1]])]);
      var inp = p[0] === 'title' ? el('input', { type: 'text' }) : el('textarea');
      inp.value = ST.meta[p[0]] != null ? ST.meta[p[0]] : IDX.meta[p[0]];
      inp.style.marginTop = '8px';
      inp.oninput = function () {
        if (inp.value === IDX.meta[p[0]] || inp.value === '') delete ST.meta[p[0]];
        else ST.meta[p[0]] = inp.value;
        changed();
      };
      c.appendChild(inp); m.appendChild(c);
    });
  }

  function viewList(m, key) {
    m.appendChild(el('h2', null, [CFG.lists[key]]));
    m.appendChild(el('p', { class: 'lead' }, ['Редактируйте любые поля, меняйте порядок стрелками ↑↓, дублируйте ⧉ для создания новой карточки или удаляйте 🗑.']));
    var host = el('div'); m.appendChild(host);
    function redraw() { host.innerHTML = ''; host.appendChild(renderValue(ST.lists, key, key, redraw)); }
    redraw();
  }

  function renderValue(parent, k, name, redraw) {
    var v = parent[k], lab = LBL[k] || (typeof k === 'string' ? k : '');
    if (Array.isArray(v)) {
      if (!v.length || typeof v[0] === 'string') {
        var ta = el('textarea'); ta.value = v.join('\n');
        ta.oninput = function () {
          parent[k] = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
          changed();
        };
        return el('div', null, [el('label', { class: 'f' }, [lab]), ta]);
      }
      var box = el('div');
      v.forEach(function (it, i) {
        var d = el('details', { class: 'item', open: i === 0 ? '' : null });
        var tools = el('span', { class: 'tools' }, [
          el('button', { class: 'btn small', type: 'button', title: 'Выше', onclick: function (e) { e.preventDefault(); if (i > 0) { v.splice(i - 1, 0, v.splice(i, 1)[0]); changed(); redraw(); } } }, ['↑']),
          el('button', { class: 'btn small', type: 'button', title: 'Ниже', onclick: function (e) { e.preventDefault(); if (i < v.length - 1) { v.splice(i + 1, 0, v.splice(i, 1)[0]); changed(); redraw(); } } }, ['↓']),
          el('button', { class: 'btn small', type: 'button', title: 'Дублировать', onclick: function (e) { e.preventDefault(); v.splice(i + 1, 0, clone(it)); changed(); redraw(); } }, ['⧉']),
          el('button', { class: 'btn small danger', type: 'button', title: 'Удалить', onclick: function (e) { e.preventDefault(); if (confirm('Удалить «' + itemTitle(it, i) + '»?')) { v.splice(i, 1); changed(); redraw(); } } }, ['🗑'])
        ]);
        d.appendChild(el('summary', null, [el('span', null, [itemTitle(it, i)]), tools]));
        var inner = el('div', { class: 'inner' });
        if (it && typeof it === 'object') {
          Object.keys(it).forEach(function (kk) {
            if (name === 'reviews' && kk === 'text') return; // В отзывах текст с кавычками отключен по ТЗ
            inner.appendChild(renderValue(it, kk, name + '-' + (i + 1) + '-' + kk, redraw));
          });
        }
        d.appendChild(inner); box.appendChild(d);
      });
      return box;
    }
    if (v && typeof v === 'object') {
      var fs = el('fieldset', null, [el('legend', null, [LBL[k] || (parent[k].label ? parent[k].label : k)])]);
      Object.keys(v).forEach(function (kk) { fs.appendChild(renderValue(v, kk, name + '-' + kk, redraw)); });
      return fs;
    }
    if (typeof v === 'boolean') {
      var cb = el('input', { type: 'checkbox' }); cb.checked = v;
      cb.onchange = function () { parent[k] = cb.checked; changed(); };
      return el('label', { class: 'f' }, [cb, ' ' + lab]);
    }
    if (typeof k === 'string' && /^img/i.test(k)) {
      return el('div', null, [
        el('label', { class: 'f' }, [lab]),
        photoField(function () { return parent[k]; }, function (p) { parent[k] = p; }, name, slug(name))
      ]);
    }
    var long = (typeof v === 'string' && (v.length > 70 || LONG[k] || v.indexOf('\n') >= 0));
    var inp = long ? el('textarea') : el('input', { type: 'text' });
    inp.value = v == null ? '' : v;
    inp.oninput = function () { parent[k] = typeof v === 'number' ? Number(inp.value) : inp.value; changed(); };
    return el('div', null, [el('label', { class: 'f' }, [lab]), inp]);
  }

  function guessRepo() {
    var h = location.hostname, p = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/.test(h)) {
      var owner = h.split('.')[0];
      var repo = (p.length && !/\.html?$/.test(p[0])) ? p[0] : owner + '.github.io';
      return owner + '/' + repo;
    }
    return 'balabanovasya/nastyafitness';
  }

  function viewPublish(m) {
    m.appendChild(el('h2', null, ['Публикация изменений в GitHub']));
    m.appendChild(el('p', { class: 'lead' }, ['Нажмите «Опубликовать изменения» — панель сохранит все новые фото и настройки в ваш репозиторий без потери прошлых фотографий.']));
    var c = el('div', { class: 'card' });
    var repo = el('input', { type: 'text', placeholder: 'balabanovasya/nastyafitness' });
    repo.value = LS('repo') || guessRepo();
    var tok = el('input', { type: 'password', placeholder: 'github_pat_…' });
    tok.value = LS('token') || '';
    var rem = el('input', { type: 'checkbox' }); rem.checked = !!LS('token');
    c.appendChild(el('label', { class: 'f' }, ['Репозиторий сайта (владелец/название)'])); c.appendChild(repo);
    c.appendChild(el('label', { class: 'f' }, ['Ключ доступа GitHub (Personal Access Token)'])); c.appendChild(tok);
    c.appendChild(el('label', { class: 'f' }, [rem, ' Запомнить ключ на этом устройстве']));
    var go = el('button', { class: 'btn primary', style: 'margin-top:14px' }, ['Опубликовать изменения']);
    var bar = el('div', { class: 'bar' }, [el('i')]);
    var log = el('div', { class: 'log', hidden: '' });
    c.appendChild(go); c.appendChild(bar); c.appendChild(log); m.appendChild(c);
    function say(t) { log.hidden = false; log.textContent += t + '\n'; log.scrollTop = log.scrollHeight; }
    go.onclick = function () { runPublish(repo.value.trim(), tok.value.trim(), rem.checked, say, bar.firstChild, go); };
    window.__publishUI = { repo: repo, tok: tok, rem: rem, say: say, bar: bar.firstChild, go: go };
  }

  function b64FromBlob(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }
  function b64FromText(t) { return btoa(unescape(encodeURIComponent(t))); }
  function gh(token, path, opt) {
    opt = opt || {};
    return fetch('https://api.github.com' + path, {
      method: opt.method || 'GET',
      cache: 'no-store',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: opt.body ? JSON.stringify(opt.body) : undefined
    });
  }
  function explain(status) {
    return status === 401 ? 'GitHub не принял ключ (неверный или истёк).' :
           status === 403 ? 'У ключа нет прав Contents -> Read and write.' :
           status === 404 ? 'Репозиторий не найден или нет доступа.' :
           'Ошибка GitHub (' + status + ').';
  }

  var publishing = false;
  function runPublish(repo, token, remember, say, bar, btn) {
    if (publishing) return;
    if (!/^[\w.\-]+\/[\w.\-]+$/.test(repo)) { toast('Укажите репозиторий в формате ник/название', true); return show('publish'); }
    if (!token) { toast('Вставьте ключ GitHub', true); return show('publish'); }
    var ov = collect(), json = JSON.stringify(ov);
    var used = Object.keys(staged).filter(function (p) { return json.indexOf(p) >= 0; });
    publishing = true; if (btn) btn.disabled = true; $('#publishTop').disabled = true;
    LS('repo', repo); LS('token', remember ? token : null);
    var branch = '', total = used.length + 1, done = 0;
    function tick() { done++; if (bar) bar.style.width = Math.round(done / total * 100) + '%'; }
    say('Проверяю доступ к ' + repo + '…');

    gh(token, '/repos/' + repo).then(function (r) {
      if (!r.ok) throw new Error(explain(r.status));
      return r.json();
    }).then(function (info) {
      branch = info.default_branch || 'main';
      say('Ветка: ' + branch + '. Новых фото к загрузке: ' + used.length);
      var chain = Promise.resolve();
      used.forEach(function (p) {
        chain = chain.then(function () {
          return gh(token, '/repos/' + repo + '/contents/' + p + '?ref=' + encodeURIComponent(branch)).then(function (rCheck) {
            return rCheck.ok ? rCheck.json() : null;
          }).then(function (existingFile) {
            return b64FromBlob(staged[p].blob).then(function (b64) {
              var putBody = { message: 'Панель: фото ' + p, content: b64, branch: branch };
              if (existingFile && existingFile.sha) putBody.sha = existingFile.sha;
              return gh(token, '/repos/' + repo + '/contents/' + p, { method: 'PUT', body: putBody });
            });
          }).then(function (r) {
            if (!r.ok) throw new Error(explain(r.status) + ' (' + p + ')');
            delete staged[p];
            say('✓ Фото сохранено: ' + p);
            tick();
          });
        });
      });
      return chain;
    }).then(function () {
      return gh(token, '/repos/' + repo + '/contents/content.js?ref=' + encodeURIComponent(branch) + '&_t=' + Date.now());
    }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(explain(r.status));
      return r.json();
    }).then(function (cur) {
      // Объединяем с уже сохраненными на сервере фото, чтобы ничего не пропало
      if (cur && cur.content) {
        try {
          var decoded = decodeURIComponent(escape(atob(cur.content.replace(/\s/g, ''))));
          var m = decoded.match(/window\.SITE_OVERRIDES\s*=\s*(\{[\s\S]*\})\s*;?/);
          if (m) {
            var remoteOv = JSON.parse(m[1]);
            ov.photos = Object.assign({}, remoteOv.photos || {}, ov.photos || {});
          }
        } catch (e) {}
      }
      var text = '/* Этот файл создаёт панель управления (admin.html). Вручную не редактируйте. */\nwindow.SITE_OVERRIDES = ' + JSON.stringify(ov, null, 1) + ';\n';
      var body = { message: 'Панель: обновление контента и настроек', content: b64FromText(text), branch: branch };
      if (cur && cur.sha) body.sha = cur.sha;
      return gh(token, '/repos/' + repo + '/contents/content.js', { method: 'PUT', body: body });
    }).then(function (r) {
      if (!r.ok) throw new Error(explain(r.status));
      tick();
      ST.photos = ov.photos || {};
      BASE = JSON.stringify(collect());
      LS('draft', null);
      changed();
      say('✓ content.js обновлён!\n\nГотово! Через 1–2 минуты обновите страницу сайта (Cmd+Shift+R или Ctrl+F5).');
      toast('Опубликовано ✓');
    }).catch(function (e) {
      say('✗ ' + (e && e.message ? e.message : e));
      toast(String(e && e.message || e), true);
    }).then(function () {
      publishing = false; if (btn) btn.disabled = false; $('#publishTop').disabled = false;
    });
    if (current !== 'publish') {
      show('publish');
      setTimeout(function () { var u = window.__publishUI; if (u) u.say('Публикую…'); }, 0);
    }
  }

  $('#publishTop').onclick = function () {
    var repo = LS('repo') || guessRepo(), token = LS('token');
    if (!repo || !token) { show('publish'); toast('Сначала вставьте ключ GitHub', true); return; }
    show('publish');
    var u = window.__publishUI;
    runPublish(repo, token, true, u.say, u.bar, u.go);
  };

  function fatal(html) { $('#main').innerHTML = ''; $('#main').appendChild(el('div', { class: 'fatal', html: html })); }
  function ready(w) {
    CFG = w.SITE_EDIT; IDX = w.SITE_EDIT_INDEX; STOCK = w.STOCK || {}; DEF = clone(w.SITE_DEFAULTS || {});
    var OV = clone(w.SITE_OVERRIDES || {});
    ST.texts = OV.texts || {}; ST.settings = OV.settings || {}; ST.photos = OV.photos || {};
    ST.meta = OV.meta || {}; ST.design = OV.design || {};
    ST.lists = clone(w.SITE_DATA_REF || {});
    BASE = JSON.stringify(collect());
    $('#siteName').textContent = CFG.name || 'Панель управления';
    document.title = 'Панель — ' + (CFG.name || 'сайт');
    show('photos');
  }

  var f = $('#probe');
  f.onload = function () {
    var tries = 0;
    (function wait() {
      try {
        var w = f.contentWindow;
        if (w && w.SITE_EDIT_INDEX && w.SITE_EDIT && w.SITE_EDIT.lists && w.SITE_EDIT.lists.certs) {
          return ready(w);
        }
      } catch (e) {
        return fatal('<b>Откройте панель по ссылке вашего сайта на GitHub Pages</b> (например, <code>https://balabanovasya.github.io/nastyafitness/admin.html</code>), а не как локальный файл с компьютера.');
      }
      if (++tries > 90) {
        try { if (f.contentWindow && f.contentWindow.SITE_EDIT_INDEX) return ready(f.contentWindow); } catch (e) {}
        return fatal('Сайт не загрузился. Проверьте, что рядом лежат <code>index.html</code> и <code>patches.js</code>, и обновите страницу.');
      }
      setTimeout(wait, 150);
    })();
  };
  f.src = 'index.html?panel=' + Date.now();
})();
</script>
</body>
</html>
